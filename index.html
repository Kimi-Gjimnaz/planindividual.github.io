<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gjimnazi Milot - Laboratori i Kimisë</title>
    <style>
        /* CSS për Aksesueshmëri dhe Profesionalizëm */
        :root {
            --bg-color: #f0f8ff; /* Blu shumë e çelët, qetësuese */
            --text-color: #002244; /* Kontrast i lartë */
            --primary-color: #0056b3;
            --secondary-color: #e6f2ff;
            --accent-color: #28a745;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 22px; /* Shkronja të mëdha për lexim të lehtë */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            text-align: center;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 1px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 20px;
        }

        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: white;
            color: var(--primary-color);
            border: 3px solid var(--primary-color);
            padding: 12px 24px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn:hover, .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .sub-tabs-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            max-width: 900px;
        }

        .sub-tab-btn {
            background-color: var(--secondary-color);
            color: var(--text-color);
            border: 2px solid #ccc;
            padding: 10px 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .sub-tab-btn:hover, .sub-tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        #experiment-area {
            background: white;
            border: 4px solid #ddd;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            min-height: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 50px;
            position: relative;
            overflow: hidden;
        }

        h2.exp-title {
            color: var(--primary-color);
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            margin-top: 0;
            text-align: center;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        button.action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        button.action-btn:active {
            transform: scale(0.95);
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* Komponentë të përbashkët të eksperimenteve */
        .beaker {
            width: 120px;
            height: 180px;
            border: 6px solid #ccc;
            border-top: none;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
            background: rgba(255,255,255,0.8);
            margin: 20px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }
        .liquid {
            width: 100%;
            height: 50%;
            background-color: rgba(0, 150, 255, 0.5);
            transition: background-color 1s, height 1s;
        }
        
        input[type=range] {
            width: 200px;
            height: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <header>
        <h1>GJIMNAZI MILOT| PLAN INDIVIDUAL 2026-2027</h1>
        <p>Laboratori Virtual i Kimisë për nxënësit në vështirësi në të nxënë</p>
    </header>

    <div class="tabs-container" id="class-tabs">
        <button class="tab-btn active" onclick="loadClass(10)">Klasa 10</button>
        <button class="tab-btn" onclick="loadClass(11)">Klasa 11</button>
        <button class="tab-btn" onclick="loadClass(12)">Klasa 12</button>
    </div>

    <div class="sub-tabs-container" id="exp-tabs">
        <!-- Butonat e eksperimenteve mbushen dinamikisht nga JS -->
    </div>

    <main id="experiment-area">
        <!-- Përmbajtja e eksperimentit -->
    </main>

    <div id="toast-container"></div>

    <script>
        // === STRUKTURA E TË DHËNAVE DHE EKSPERIMENTEVE ===
        const labData = {
            10: [
                { title: "1. Shpërhapja e Grimcave", render: render10_1 },
                { title: "2. Kromatografia", render: render10_2 },
                { title: "3. Asnjanësimi Acido-Bazik", render: render10_3 },
                { title: "4. Modelet Molekulare", render: render10_4 },
                { title: "5. Gazi nga Acidi", render: render10_5 }
            ],
            11: [
                { title: "1. Elektroliza", render: render11_1 },
                { title: "2. Ndryshkja e Hekurit", render: render11_2 },
                { title: "3. Shpejtësia & Temperatura", render: render11_3 },
                { title: "4. Ekzo/Endotermik", render: render11_4 },
                { title: "5. Letra e Lakmusit", render: render11_5 }
            ],
            12: [
                { title: "1. Forma Gjeometrike", render: render12_1 },
                { title: "2. Efekti i Jonit", render: render12_2 },
                { title: "3. Ndikimi i Katalizatorit", render: render12_3 },
                { title: "4. Lakorja e Titullimit", render: render12_4 },
                { title: "5. Oksidimi i Alkooleve", render: render12_5 }
            ]
        };

        let currentClass = 10;
        let animationFrameId = null; 
        let intervalId = null;

        // === FUNKSIONET KRYESORE ===
        function loadClass(classNum) {
            currentClass = classNum;
            
            // Ndrysho butonin aktiv të klasës
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.includes(classNum)) btn.classList.add('active');
            });

            // Krijo butonat për eksperimentet e kësaj klase
            const expTabs = document.getElementById('exp-tabs');
            expTabs.innerHTML = '';
            labData[classNum].forEach((exp, index) => {
                const btn = document.createElement('button');
                btn.className = 'sub-tab-btn';
                if(index === 0) btn.classList.add('active');
                btn.innerText = exp.title;
                btn.onclick = () => loadExperiment(index, btn);
                expTabs.appendChild(btn);
            });

            // Ngarko eksperimentin e parë
            loadExperiment(0, expTabs.firstChild);
            showToast(`U hap laboratori për Klasën ${classNum}!`);
        }

        function loadExperiment(index, btnElement) {
            // Pastro animimet e vjetra
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            if(intervalId) clearInterval(intervalId);

            document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const expArea = document.getElementById('experiment-area');
            expArea.innerHTML = ''; 
            
            const exp = labData[currentClass][index];
            
            const title = document.createElement('h2');
            title.className = 'exp-title';
            title.innerText = exp.title;
            expArea.appendChild(title);

            const contentDiv = document.createElement('div');
            contentDiv.style.width = "100%";
            contentDiv.style.display = "flex";
            contentDiv.style.flexDirection = "column";
            contentDiv.style.alignItems = "center";
            expArea.appendChild(contentDiv);

            // Ekzekuto funksionin specifik të eksperimentit
            exp.render(contentDiv);
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        }

        // === RENDERIMET KLASA 10 ===
        function render10_1(container) {
            container.innerHTML = `<canvas id="diffCanvas" width="400" height="250" style="border:2px solid #ccc; background:#fff; border-radius:10px;"></canvas>
            <div class="controls"><button class="action-btn" id="btnDiff">Fillo Shpërhapjen</button></div>`;
            
            const canvas = document.getElementById('diffCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            
            document.getElementById('btnDiff').onclick = () => {
                showToast("Shkëlqyeshëm! Grimcat po përhapen.");
                particles = Array.from({length: 50}, () => ({
                    x: 200, y: 125,
                    vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                    color: Math.random() > 0.5 ? 'red' : 'blue'
                }));
                
                function draw() {
                    ctx.clearRect(0,0,400,250);
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy;
                        // Bounce
                        if(p.x < 0 || p.x > 400) p.vx *= -1;
                        if(p.y < 0 || p.y > 250) p.vy *= -1;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 6, 0, Math.PI*2);
                        ctx.fillStyle = p.color;
                        ctx.fill();
                    });
                    animationFrameId = requestAnimationFrame(draw);
                }
                draw();
            };
        }

        function render10_2(container) {
            container.innerHTML = `
                <div style="width:100px; height:250px; border:2px solid #ddd; background:#f9f9f9; position:relative; overflow:hidden;">
                    <div id="waterLevel" style="position:absolute; bottom:0; width:100%; height:30px; background:rgba(0,0,255,0.2);"></div>
                    <div id="dotRed" style="position:absolute; bottom:40px; left:40px; width:20px; height:20px; border-radius:50%; background:red; transition: bottom 3s;"></div>
                    <div id="dotBlue" style="position:absolute; bottom:40px; left:40px; width:20px; height:20px; border-radius:50%; background:blue; mix-blend-mode: multiply; transition: bottom 4s;"></div>
                </div>
                <div class="controls"><button class="action-btn" id="btnChroma">Fut letrën në tretës</button></div>
            `;
            document.getElementById('btnChroma').onclick = () => {
                showToast("Të lumtë! Ngjyrat po ndahen nga kromatografia.");
                document.getElementById('dotRed').style.bottom = "180px";
                document.getElementById('dotBlue').style.bottom = "120px";
            };
        }

        function render10_3(container) {
            container.innerHTML = `
                <div class="beaker"><div id="acidLiquid" class="liquid" style="background-color: rgba(255,0,0,0.6);"></div></div>
                <p>Acidi është i Kuq. Baza do ta bëjë të Gjelbër (Asnjanës).</p>
                <div class="controls"><button class="action-btn" id="btnNeutral">Shto Bazë (NaOH)</button></div>
            `;
            document.getElementById('btnNeutral').onclick = () => {
                document.getElementById('acidLiquid').style.backgroundColor = "rgba(0,255,0,0.6)";
                document.getElementById('acidLiquid').style.height = "70%";
                showToast("E saktë! Tretësira u asnjanësua.");
            };
        }

        function render10_4(container) {
            container.innerHTML = `
                <div style="display:flex; gap:50px; margin-top:20px;">
                    <div style="text-align:center;">
                        <h3>Uji (H₂O)</h3>
                        <div style="display:flex; align-items:center; justify-content:center; position:relative; height:100px;">
                            <div style="width:30px; height:30px; background:gray; border-radius:50%; position:absolute; left:0; top:20px;"></div>
                            <div style="width:60px; height:60px; background:red; border-radius:50%; z-index:2;"></div>
                            <div style="width:30px; height:30px; background:gray; border-radius:50%; position:absolute; right:0; top:20px;"></div>
                        </div>
                    </div>
                    <div style="text-align:center;">
                        <h3>Dioksidi Karbonit (CO₂)</h3>
                        <div style="display:flex; align-items:center; justify-content:center; height:100px;">
                            <div style="width:40px; height:40px; background:red; border-radius:50%;"></div>
                            <div style="width:60px; height:60px; background:black; border-radius:50%; margin: 0 -5px; z-index:2;"></div>
                            <div style="width:40px; height:40px; background:red; border-radius:50%;"></div>
                        </div>
                    </div>
                </div>
                <p style="margin-top:20px;">Oksigjeni (i Kuq), Hidrogjeni (Gri), Karboni (i Zi)</p>
            `;
        }

        function render10_5(container) {
            container.innerHTML = `
                <div class="beaker" id="gasBeaker" style="position:relative;">
                    <div class="liquid" style="background-color:rgba(200,200,200,0.5);"></div>
                    <div style="width:40px; height:20px; background:darkgray; position:absolute; bottom:10px; left:40px;"></div>
                </div>
                <div class="controls"><button class="action-btn" id="btnGas">Hidh Acid te Metali</button></div>
            `;
            document.getElementById('btnGas').onclick = () => {
                showToast("Shumë mirë! Po çlirohet gaz hidrogjeni.");
                const beaker = document.getElementById('gasBeaker');
                intervalId = setInterval(() => {
                    const bubble = document.createElement('div');
                    bubble.style.width = "10px"; bubble.style.height = "10px";
                    bubble.style.background = "white"; bubble.style.borderRadius = "50%";
                    bubble.style.position = "absolute"; bubble.style.bottom = "30px";
                    bubble.style.left = (40 + Math.random()*30) + "px";
                    bubble.style.transition = "bottom 2s, opacity 2s";
                    beaker.appendChild(bubble);
                    setTimeout(() => { bubble.style.bottom = "180px"; bubble.style.opacity = "0"; }, 50);
                    setTimeout(() => { bubble.remove(); }, 2000);
                }, 300);
            };
        }

        // === RENDERIMET KLASA 11 ===
        function render11_1(container) {
            container.innerHTML = `
                <div class="beaker" id="elecBeaker" style="position:relative; width: 160px;">
                    <div class="liquid" style="background-color:rgba(0,255,255,0.4); height: 70%;"></div>
                    <div style="width:15px; height:120px; background:#444; position:absolute; bottom:10px; left:40px;"></div>
                    <div style="width:15px; height:120px; background:#444; position:absolute; bottom:10px; right:40px;"></div>
                    <div style="position:absolute; top:20px; left:35px; font-weight:bold;">Anoda</div>
                    <div style="position:absolute; top:20px; right:20px; font-weight:bold;">Katoda</div>
                </div>
                <div class="controls"><button class="action-btn" id="btnElec">Ndiz Rrymën</button></div>
            `;
            document.getElementById('btnElec').onclick = () => {
                showToast("Të lumtë! Elektroliza filloi.");
                const beaker = document.getElementById('elecBeaker');
                intervalId = setInterval(() => {
                    [42, 102].forEach(leftPos => {
                        const bubble = document.createElement('div');
                        bubble.style.width = "6px"; bubble.style.height = "6px";
                        bubble.style.background = "rgba(255,255,255,0.8)"; bubble.style.borderRadius = "50%";
                        bubble.style.position = "absolute"; bubble.style.bottom = "20px";
                        bubble.style.left = leftPos + Math.random()*5 + "px";
                        bubble.style.transition = "bottom 1.5s linear";
                        beaker.appendChild(bubble);
                        setTimeout(() => bubble.style.bottom = "130px", 50);
                        setTimeout(() => bubble.remove(), 1500);
                    });
                }, 200);
            };
        }

        function render11_2(container) {
            container.innerHTML = `
                <div style="display:flex; align-items:center; gap:10px; margin: 30px 0;">
                    <div style="width:150px; height:30px; background:#aaa; border-radius:5px 15px 15px 5px; position:relative; box-shadow: inset 0 -5px 5px rgba(0,0,0,0.2);" id="nail">
                       <div style="position:absolute; left:-10px; top:-5px; width:20px; height:40px; background:#aaa; border-radius:5px;"></div>
                    </div>
                </div>
                <p>Koha në mjedis me lagështi:</p>
                <div class="controls"><input type="range" id="rustSlider" min="0" max="100" value="0"></div>
                <p id="rustText">Hekur i pastër</p>
            `;
            document.getElementById('rustSlider').oninput = function() {
                const val = this.value;
                const r = 170 + (139 - 170) * (val/100);
                const g = 170 + (69 - 170) * (val/100);
                const b = 170 + (19 - 170) * (val/100);
                const color = `rgb(${r},${g},${b})`;
                
                document.getElementById('nail').style.backgroundColor = color;
                document.getElementById('nail').firstElementChild.style.backgroundColor = color;
                
                if(val == 100) {
                    document.getElementById('rustText').innerText = "Plotësisht i ndryshkur (Oksid Hekuri)";
                    showToast("Shumë mirë! Pe se si ndryshkja varet nga koha.");
                } else {
                    document.getElementById('rustText').innerText = "Duke u ndryshkur...";
                }
            };
        }

        function render11_3(container) {
            container.innerHTML = `
                <canvas id="speedCanvas" width="300" height="200" style="border:2px solid #ccc; border-radius:10px;"></canvas>
                <p>Temperatura: <span id="tempVal">20</span>°C</p>
                <div class="controls"><input type="range" id="tempSlider" min="0" max="100" value="20"></div>
            `;
            const canvas = document.getElementById('speedCanvas');
            const ctx = canvas.getContext('2d');
            const particles = Array.from({length: 30}, () => ({
                x: Math.random()*300, y: Math.random()*200,
                baseVx: (Math.random()-0.5)*2, baseVy: (Math.random()-0.5)*2
            }));

            function drawParticles() {
                const temp = document.getElementById('tempSlider').value;
                const speedMult = (temp / 20) || 0.1;
                ctx.clearRect(0,0,300,200);
                
                // Color mapping: cold (blue) to hot (red)
                const r = Math.min(255, temp * 2.5);
                const b = Math.max(0, 255 - temp * 2.5);
                ctx.fillStyle = `rgb(${r}, 0, ${b})`;

                particles.forEach(p => {
                    p.x += p.baseVx * speedMult;
                    p.y += p.baseVy * speedMult;
                    if(p.x<0 || p.x>300) p.baseVx *= -1;
                    if(p.y<0 || p.y>200) p.baseVy *= -1;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
                    ctx.fill();
                });
                animationFrameId = requestAnimationFrame(drawParticles);
            }
            drawParticles();

            document.getElementById('tempSlider').onchange = () => showToast("Bravo! Rritja e temperaturës rrit shpejtësinë e goditjeve.");
            document.getElementById('tempSlider').oninput = function() { document.getElementById('tempVal').innerText = this.value; };
        }

        function render11_4(container) {
            container.innerHTML = `
                <div style="width:30px; height:150px; border:4px solid #333; border-radius:15px; position:relative; background:#eee; margin-top:20px;">
                    <div id="mercury" style="position:absolute; bottom:0; width:100%; height:50%; background:red; border-radius:0 0 10px 10px; transition: height 1s, background 1s;"></div>
                </div>
                <div class="controls">
                    <button class="action-btn" id="btnExo" style="background:#dc3545;">Ekzotermik (Çliron Nxehtësi)</button>
                    <button class="action-btn" id="btnEndo" style="background:#007bff;">Endotermik (Thith Nxehtësi)</button>
                </div>
            `;
            document.getElementById('btnExo').onclick = () => {
                document.getElementById('mercury').style.height = "90%";
                document.getElementById('mercury').style.background = "red";
                showToast("Saktë! Termometri rritet.");
            };
            document.getElementById('btnEndo').onclick = () => {
                document.getElementById('mercury').style.height = "20%";
                document.getElementById('mercury').style.background = "blue";
                showToast("Saktë! Termometri ulet.");
            };
        }

        function render11_5(container) {
            container.innerHTML = `
                <div id="paperStrip" style="width:50px; height:150px; background:#f4f4c8; border:1px solid #ccc; margin:20px; transition: background 1s;"></div>
                <div class="controls">
                    <button class="action-btn" id="btnAcidPaper">Fut në Acid</button>
                    <button class="action-btn" id="btnBasePaper">Fut në Bazë</button>
                </div>
            `;
            document.getElementById('btnAcidPaper').onclick = () => {
                document.getElementById('paperStrip').style.background = "#ff6b6b";
                showToast("Të lumtë! Letra bëhet e Kuqe.");
            };
            document.getElementById('btnBasePaper').onclick = () => {
                document.getElementById('paperStrip').style.background = "#4dabf7";
                showToast("Të lumtë! Letra bëhet e Kaltër.");
            };
        }

        // === RENDERIMET KLASA 12 ===
        function render12_1(container) {
            container.innerHTML = `
                <div style="display:flex; justify-content:space-around; width:100%; margin-top:20px; align-items:flex-end;">
                    <div style="text-align:center;">
                        <h3 style="color:#0056b3;">Uji (Këndore)</h3>
                        <svg width="100" height="100"><circle cx="50" cy="30" r="15" fill="red"/><circle cx="20" cy="70" r="10" fill="gray"/><circle cx="80" cy="70" r="10" fill="gray"/><line x1="50" y1="30" x2="20" y2="70" stroke="black" stroke-width="3"/><line x1="50" y1="30" x2="80" y2="70" stroke="black" stroke-width="3"/></svg>
                    </div>
                    <div style="text-align:center;">
                        <h3 style="color:#0056b3;">CO₂ (Lineare)</h3>
                        <svg width="120" height="100"><circle cx="60" cy="50" r="15" fill="black"/><circle cx="20" cy="50" r="15" fill="red"/><circle cx="100" cy="50" r="15" fill="red"/><line x1="20" y1="47" x2="60" y2="47" stroke="black" stroke-width="3"/><line x1="20" y1="53" x2="60" y2="53" stroke="black" stroke-width="3"/><line x1="60" y1="47" x2="100" y2="47" stroke="black" stroke-width="3"/><line x1="60" y1="53" x2="100" y2="53" stroke="black" stroke-width="3"/></svg>
                    </div>
                    <div style="text-align:center;">
                        <h3 style="color:#0056b3;">Metani (Tetraedrike)</h3>
                        <svg width="100" height="100"><circle cx="50" cy="50" r="15" fill="black"/><circle cx="50" cy="15" r="8" fill="gray"/><circle cx="20" cy="75" r="8" fill="gray"/><circle cx="80" cy="75" r="8" fill="gray"/><line x1="50" y1="50" x2="50" y2="15" stroke="black" stroke-width="3"/><line x1="50" y1="50" x2="20" y2="75" stroke="black" stroke-width="3"/><line x1="50" y1="50" x2="80" y2="75" stroke="black" stroke-width="3"/></svg>
                    </div>
                </div>
                <p style="margin-top:20px; font-size:18px;">Gjeometria e molekulave varet nga çiftet e elektroneve.</p>
            `;
        }

        function render12_2(container) {
            container.innerHTML = `
                <div class="beaker" id="ionBeaker" style="position:relative;">
                    <div class="liquid" style="background-color:rgba(100,200,100,0.4); height: 80%;"></div>
                </div>
                <div class="controls"><button class="action-btn" id="btnAddIon">Shto Jon të Përbashkët</button></div>
            `;
            document.getElementById('btnAddIon').onclick = () => {
                showToast("Bukur! Joni i përbashkët ul tretshmërinë (Krijon precipitat).");
                const beaker = document.getElementById('ionBeaker');
                for(let i=0; i<15; i++) {
                    const dot = document.createElement('div');
                    dot.style.width = "8px"; dot.style.height = "8px";
                    dot.style.background = "white"; dot.style.borderRadius = "50%";
                    dot.style.position = "absolute"; dot.style.top = "10px";
                    dot.style.left = 10 + Math.random()*80 + "px";
                    dot.style.transition = "top 2s cubic-bezier(0.4, 0, 1, 1)";
                    beaker.appendChild(dot);
                    setTimeout(() => dot.style.top = (160 + Math.random()*10) + "px", 50);
                }
            };
        }

        function render12_3(container) {
            container.innerHTML = `
                <div style="width:100%; border-bottom:3px dashed #ccc; padding:10px 0; position:relative; height:40px;">
                    <span style="position:absolute; left:0; top:-10px; font-size:16px;">Pa Katalizator</span>
                    <div id="car1" style="width:30px; height:30px; background:red; border-radius:5px; position:absolute; left:0; transition: left 4s linear;"></div>
                </div>
                <div style="width:100%; border-bottom:3px dashed #ccc; padding:10px 0; position:relative; height:40px; margin-top:30px;">
                    <span style="position:absolute; left:0; top:-10px; font-size:16px;">Me Katalizator</span>
                    <div id="car2" style="width:30px; height:30px; background:green; border-radius:5px; position:absolute; left:0; transition: left 1s linear;"></div>
                </div>
                <div class="controls" style="margin-top:30px;"><button class="action-btn" id="btnRace">Fillo Reaksionin</button></div>
            `;
            document.getElementById('btnRace').onclick = () => {
                document.getElementById('car1').style.left = "0";
                document.getElementById('car2').style.left = "0";
                setTimeout(() => {
                    document.getElementById('car1').style.left = "90%";
                    document.getElementById('car2').style.left = "90%";
                    showToast("E saktë! Katalizatori e rrit shumë shpejtësinë.");
                }, 100);
            };
        }

        function render12_4(container) {
            container.innerHTML = `
                <div class="beaker">
                    <div id="titrLiquid" class="liquid" style="background-color:rgba(255,105,180,0.8); height:60%;"></div>
                </div>
                <div class="controls"><button class="action-btn" id="btnDrop">Shto Pikë Titulluesi</button></div>
                <p id="titrText">Tretësira është Bazike (Fenolftaleina rozë)</p>
            `;
            let drops = 0;
            document.getElementById('btnDrop').onclick = () => {
                drops++;
                const liquid = document.getElementById('titrLiquid');
                if(drops === 1) liquid.style.backgroundColor = "rgba(255,105,180,0.5)";
                if(drops === 2) liquid.style.backgroundColor = "rgba(255,105,180,0.2)";
                if(drops >= 3) {
                    liquid.style.backgroundColor = "rgba(200,200,200,0.2)";
                    document.getElementById('titrText').innerText = "Pika e Ekuivalencës! Asnjanës.";
                    showToast("Përsosmëri! Gjetëm pikën e ekuivalencës.");
                }
            };
        }

        function render12_5(container) {
            container.innerHTML = `
                <div class="beaker">
                    <div id="alcLiquid" class="liquid" style="background-color:rgba(255,165,0,0.8); height:50%;"></div>
                </div>
                <p>Joni Dikromat (Portokalli)</p>
                <div class="controls"><button class="action-btn" id="btnOxid">Oksido Alkoolin</button></div>
            `;
            document.getElementById('btnOxid').onclick = () => {
                document.getElementById('alcLiquid').style.backgroundColor = "rgba(0,128,0,0.8)";
                showToast("Bravo! Dikromati u reduktua në jone Kromi(III) jeshil.");
            };
        }

        // Fillo aplikacionin
        window.onload = () => loadClass(10);

    </script>
</body>
</html>
